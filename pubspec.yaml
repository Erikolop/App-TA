name: smartgrown_app
description: "SmartGrow: Soil moisture monitoring and automatic watering via ESP32 and Flutter."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Networking & state
  http: ^1.2.2
  provider: ^6.1.2

  # Charts & gauges
  fl_chart: ^0.69.0
  syncfusion_flutter_gauges: ^35.1.46

  # UI polish
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
